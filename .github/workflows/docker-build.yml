name: docker-image

# Build the Hermes Web frontend Docker image and publish to GHCR. The build is
# NIX-FREE: the Dockerfile fetches the renderer from the LATEST upstream
# hermes-agent (HERMES_RENDERER_REV, default main) and builds with plain pnpm —
# a normal `docker build` in CI and locally. The container only serves static
# files + proxies to a gateway.
#
# Pull requests build the image without publishing it. Pushes to main, v* tags,
# manual dispatches, and the daily build publish it to GHCR. The daily build
# keeps the image tracking new upstream hermes-agent commits even with no local
# repository changes.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}
  schedule:
    # Rebuild every day at 05:00 UTC to pick up the latest upstream hermes-agent.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      renderer_rev:
        description: 'hermes-agent commit, tag, or branch to bundle'
        required: false
        default: main
        type: string

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Multi-architecture images are published; PRs use amd64 so the
          # image can be loaded locally for the smoke test below.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HERMES_RENDERER_REV=${{ inputs.renderer_rev || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        if: github.event_name == 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          image_tag="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          docker run --detach --rm \
            --name hermes-web-smoke \
            --publish 8080:80 \
            --env HERMES_GATEWAY_URL=http://127.0.0.1:9119 \
            --env HERMES_HOME=/tmp/hermes \
            "$image_tag"
          trap 'docker rm --force hermes-web-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs hermes-web-smoke
          exit 1
